version: '3.7'

services:
  app:
    image: app_vuelos:dev
    container_name: app_vuelos_dev
    build:
      context: ./apiGateway
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - 80:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ms_nestjs_dev
    volumes:
      - ./apiGateway:/app
      - /app/node_modules
    command: pnpm run start:dev

  microservice-auth:
    image: microservice-auth:dev
    container_name: microservice_auth_dev
    build:
      context: ./microserviceAuth
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
    restart: always
    networks:
      - ms_nestjs_dev
    volumes:
      - ./microserviceAuth:/app
      - /app/node_modules
    command: pnpm run start:dev

  microservice-users:
    image: microservice-users:dev
    container_name: microservice-users_dev
    build:
      context: ./microserviceUsers
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_users:
        condition: service_healthy
    restart: always
    networks:
      - ms_nestjs_dev
    volumes:
      - ./microserviceUsers:/app
      - /app/node_modules
    command: pnpm run start:dev

  microservice-products:
    image: microservice-products:dev
    container_name: microservice-products_dev
    build:
      context: ./microserviceProducts
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_users:
        condition: service_healthy
    restart: always
    networks:
      - ms_nestjs_dev
    volumes:
      - ./microserviceProducts:/app
      - /app/node_modules
    command: pnpm run start:dev

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    networks:
      - ms_nestjs_dev
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_auth:
    image: postgres:latest
    container_name: postgres_auth_db_dev
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user_auth
      POSTGRES_PASSWORD: password_auth
    volumes:
      - postgres_auth_data_dev:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - ms_nestjs_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_users:
    image: postgres:latest
    container_name: postgres_users_db_dev
    restart: always
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user_users
      POSTGRES_PASSWORD: password_users
    volumes:
      - postgres_users_data_dev:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - ms_nestjs_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_products:
    image: postgres:latest
    container_name: postgres_products_db_dev
    restart: always
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: user_products
      POSTGRES_PASSWORD: password_products
    volumes:
      - postgres_products_data_dev:/var/lib/postgresql/data
    expose:
      - 5432
    networks:
      - ms_nestjs_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: 12345
    ports:
      - "8080:80"
    depends_on:
      postgres_auth:
        condition: service_healthy
      postgres_users:
        condition: service_healthy
    networks:
      - ms_nestjs_dev

volumes:
  postgres_auth_data_dev:
  postgres_users_data_dev:
  postgres_products_data_dev:

networks:
  ms_nestjs_dev: